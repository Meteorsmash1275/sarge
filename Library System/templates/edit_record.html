{% extends "base.html" %}
{% block title %}Edit Record{% endblock %}
{% block content %}
<h1>Edit Book #{{ book.book_id }}</h1>
<form class="form-card" method="POST" action="{{ url_for('edit_record', book_id=book.book_id) }}">
  <label>Title</label>
  <input type="text" name="title" value="{{ book.title }}" required>

  <label>Author</label>
  <input type="text" name="author" value="{{ book.author }}" required>

  <label>Genre</label>
  <input type="text" name="genre" value="{{ book.genre }}" required>

  <label>Copies</label>
  <input type="number" name="copies" min="0" value="{{ book.copies }}" required>

  <button class="btn primary" type="submit">Update Record</button>
  <a class="btn" href="{{ url_for('view_records') }}">Cancel</a>
</form>
{% endblock %}
