{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Error {{ code }}</h1>
  <p class="sub">{{ message }}</p>
  {% if user %}
    <a class="btn primary" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
  {% else %}
    <a class="btn primary" href="{{ url_for('login') }}">Back to Login</a>
  {% endif %}
</div>
{% endblock %}
